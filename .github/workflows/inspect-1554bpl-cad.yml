name: Finalize 1554BPL mechanical documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-1554bpl-cad.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale dimensions from documentation and placement comments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mechanical/pcb-layout.md')
          t = p.read_text(encoding='utf-8')
          replacements = {
              '- overall width: **55.45 mm**': '- overall envelope width: **55.96 mm**',
              '- corner relief radius: **R9.525 mm** (3/8 in)': '- corner transition radius: **R9.525 mm** (3/8 in)',
              '- stepped straight section: **10.16 mm**': '- corner stem length: **10.16 mm** (0.4 in)\n- short corner ledge/offset: **0.508 mm** (0.02 in)\n- top/bottom central straight: **36.402 mm** (shown as 36.40 mm)\n- right tangent/reference extent: **55.452 mm** (shown as 55.45 mm)',
              '- upper mounting-hole centre: **16.46 mm** from the top datum': '- upper mounting-hole centre: **16.47 mm** from the top datum',
              '- lower mounting-hole centre: **37.98 mm** from the top datum': '- lower mounting-hole centre: **37.99 mm** from the top datum',
              '- maximum right extent: X = 155.45 mm': '- maximum right extent: X = 155.96 mm',
              '- H1 = (127.98, 116.46) mm': '- H1 = (127.98, 116.47) mm',
              '- H2 = (127.98, 137.98) mm': '- H2 = (127.98, 137.99) mm',
              '- antenna/right-side keepout: approximately X = 149...155.45 mm': '- antenna/right-side keepout: approximately X = 149...155.96 mm',
              'The exact steel-panel contour is treated as the source of truth. Do **not** replace it with a 52 x 52 mm rectangle or simplified corner cut-outs.': 'The exact steel-panel contour is treated as the source of truth. Its 55.45 mm drawing dimension is a tangent/reference extent, **not the full PCB envelope width**; the short 0.508 mm ledge brings the maximum extent to 55.96 mm. Do **not** replace the profile with a rectangle, a simple rounded rectangle, or symmetric corner cut-outs.',
          }
          for old, new in replacements.items():
              if old not in t:
                  raise SystemExit(f'mechanical/pcb-layout.md: expected text missing: {old}')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8', newline='\n')

          p = Path('tools/place_pcb.py')
          t = p.read_text(encoding='utf-8')
          replacements = {
              '#   X = 100.00 ... 155.45 mm': '#   X = 100.00 ... 155.96 mm',
              '# H1 = (127.98, 116.46), H2 = (127.98, 137.98).': '# H1 = (127.98, 116.47), H2 = (127.98, 137.99).',
          }
          for old, new in replacements.items():
              if old not in t:
                  raise SystemExit(f'tools/place_pcb.py: expected text missing: {old}')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8', newline='\n')

          # Guard against the specific stale claims that caused the bad outline.
          mech = Path('mechanical/pcb-layout.md').read_text(encoding='utf-8')
          place = Path('tools/place_pcb.py').read_text(encoding='utf-8')
          assert 'overall width: **55.45 mm**' not in mech
          assert 'maximum right extent: X = 155.45 mm' not in mech
          assert 'X = 100.00 ... 155.45 mm' not in place
          PY

      - name: Commit documentation correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanical/pcb-layout.md tools/place_pcb.py
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
            exit 0
          fi
          git commit -m 'docs: correct 1554BPL envelope dimensions'
          git push origin HEAD:main
