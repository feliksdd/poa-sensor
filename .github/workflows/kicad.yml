name: KiCad
on:
  push:
    paths: ['hardware/**', 'mechanical/**', 'tools/**', 'bom/bom.csv', '.github/workflows/kicad.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Configure KiCad libraries
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Check current hardware
        run: bash tools/check_hardware.sh
      - name: Upload check outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad
          path: build/kicad/
