name: Correct Hammond 1554BPL arc orientation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-1554bpl-arcs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct arc midpoints and synchronize production PCB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('hardware/poa-sensor-layout-template.kicad_pcb')
          s = p.read_text(encoding='utf-8')
          repl = {
              '(mid 152.662192 102.789808)': '(mid 148.716808 106.735192)',
              '(mid 153.170192 143.010192)': '(mid 149.224808 139.064808)',
              '(mid 103.297808 153.170192)': '(mid 107.243192 149.224808)',
              '(mid 102.789808 112.949808)': '(mid 106.735192 116.895192)',
          }
          for old, new in repl.items():
              if old not in s:
                  raise SystemExit(f'missing expected old arc midpoint: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

          python3 tools/sync_pcb_mechanics.py

          python3 - <<'PY'
          from pathlib import Path
          expected = [
              '(mid 148.716808 106.735192)',
              '(mid 149.224808 139.064808)',
              '(mid 107.243192 149.224808)',
              '(mid 106.735192 116.895192)',
          ]
          obsolete = [
              '(mid 152.662192 102.789808)',
              '(mid 153.170192 143.010192)',
              '(mid 103.297808 153.170192)',
              '(mid 102.789808 112.949808)',
          ]
          for f in ['hardware/poa-sensor-layout-template.kicad_pcb','hardware/poa-sensor.kicad_pcb']:
              s = Path(f).read_text(encoding='utf-8')
              for token in expected:
                  if token not in s:
                      raise SystemExit(f'{f}: missing corrected arc {token}')
              for token in obsolete:
                  if token in s:
                      raise SystemExit(f'{f}: obsolete wrong-side arc remains {token}')
              print(f'{f}: 1554BPL arc orientation validated')
          PY

          python3 tools/sync_pcb_mechanics.py --check

      - name: Commit corrected outline
        shell: bash
        run: |
          if git diff --quiet -- hardware/poa-sensor-layout-template.kicad_pcb hardware/poa-sensor.kicad_pcb; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware/poa-sensor-layout-template.kicad_pcb hardware/poa-sensor.kicad_pcb
          git commit -m 'mechanical: fix 1554BPL arc direction'
          git push origin HEAD:main
