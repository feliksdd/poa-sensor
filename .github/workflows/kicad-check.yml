name: KiCad checks

on:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad-check.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad-check.yml'
  workflow_dispatch:

jobs:
  kicad-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        id: files
        shell: bash
        run: |
          if [ -f hardware/poa-sensor.kicad_sch ]; then
            echo "schematic=true" >> "$GITHUB_OUTPUT"
          else
            echo "schematic=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f hardware/poa-sensor.kicad_pcb ]; then
            echo "pcb=true" >> "$GITHUB_OUTPUT"
          else
            echo "pcb=false" >> "$GITHUB_OUTPUT"
          fi

      # Temporary bootstrap normalization: once the normalized native schematic
      # is committed, change these two commands to --check.
      - name: Normalize converted schematic for checks
        if: steps.files.outputs.schematic == 'true'
        run: |
          python3 tools/normalize_schematic.py
          python3 tools/normalize_geometry.py

      - name: Prepare KiCad CI library tables
        shell: bash
        run: |
          mkdir -p .kicad-ci
          cat > .kicad-ci/sym-lib-table <<'EOF'
          (sym_lib_table
            (version 7)
            (lib (name "Device")(type "KiCad")(uri "/usr/share/kicad/symbols/Device.kicad_sym")(options "")(descr "KiCad Device symbols"))
            (lib (name "Connector_Generic")(type "KiCad")(uri "/usr/share/kicad/symbols/Connector_Generic.kicad_sym")(options "")(descr "KiCad generic connectors"))
          )
          EOF
          cat > .kicad-ci/fp-lib-table <<'EOF'
          (fp_lib_table
            (version 7)
            (lib (name "Package_TSSOP")(type "KiCad")(uri "/usr/share/kicad/footprints/Package_TSSOP.pretty")(options "")(descr "KiCad TSSOP packages"))
          )
          EOF

      - name: KiCad version
        run: |
          docker run --rm kicad/kicad:9.0.9 kicad-cli version

      - name: Schematic ERC
        if: steps.files.outputs.schematic == 'true'
        shell: bash
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -v "$PWD/.kicad-ci:/tmp/.config/kicad/9.0" \
            -w /work \
            kicad/kicad:9.0.9 \
            kicad-cli sch erc --severity-all --exit-code-violations \
            -o hardware/poa-sensor-erc.rpt \
            hardware/poa-sensor.kicad_sch
          rc=$?
          echo "----- KiCad ERC report -----"
          cat hardware/poa-sensor-erc.rpt || true
          exit $rc

      - name: PCB DRC
        if: steps.files.outputs.pcb == 'true'
        shell: bash
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -v "$PWD/.kicad-ci:/tmp/.config/kicad/9.0" \
            -w /work \
            kicad/kicad:9.0.9 \
            kicad-cli pcb drc --severity-all --exit-code-violations --schematic-parity \
            -o hardware/poa-sensor-drc.rpt \
            hardware/poa-sensor.kicad_pcb
          rc=$?
          echo "----- KiCad DRC report -----"
          cat hardware/poa-sensor-drc.rpt || true
          exit $rc

      - name: Explain bootstrap state
        if: steps.files.outputs.schematic != 'true' && steps.files.outputs.pcb != 'true'
        run: |
          echo "Legacy bootstrap schematic is still present."
          echo "Open hardware/poa-sensor.sch in KiCad and save it as poa-sensor.kicad_sch to enable ERC."
