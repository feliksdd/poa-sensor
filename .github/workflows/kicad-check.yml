name: KiCad checks

on:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad-check.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad-check.yml'
  workflow_dispatch:

jobs:
  kicad-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        id: files
        shell: bash
        run: |
          if [ -f hardware/poa-sensor.kicad_sch ]; then
            echo "schematic=true" >> "$GITHUB_OUTPUT"
          else
            echo "schematic=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f hardware/poa-sensor.kicad_pcb ]; then
            echo "pcb=true" >> "$GITHUB_OUTPUT"
          else
            echo "pcb=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check schematic metadata
        if: steps.files.outputs.schematic == 'true'
        run: python3 tools/normalize_schematic.py --check

      - name: KiCad version
        run: |
          docker run --rm kicad/kicad:9.0.9 version

      - name: Schematic ERC
        if: steps.files.outputs.schematic == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kicad/kicad:9.0.9 \
            sch erc --severity-all --exit-code-violations \
            -o hardware/poa-sensor-erc.rpt \
            hardware/poa-sensor.kicad_sch

      - name: PCB DRC
        if: steps.files.outputs.pcb == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            kicad/kicad:9.0.9 \
            pcb drc --severity-all --exit-code-violations --schematic-parity \
            -o hardware/poa-sensor-drc.rpt \
            hardware/poa-sensor.kicad_pcb

      - name: Explain bootstrap state
        if: steps.files.outputs.schematic != 'true' && steps.files.outputs.pcb != 'true'
        run: |
          echo "Legacy bootstrap schematic is still present."
          echo "Open hardware/poa-sensor.sch in KiCad and save it as poa-sensor.kicad_sch to enable ERC."
