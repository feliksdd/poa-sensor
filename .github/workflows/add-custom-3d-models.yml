name: Add project-local 3D models

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-custom-3d-models.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate STEP envelopes and bind footprint models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cadquery
          python3 tools/generate_3d_models.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def append_model(path: Path, model_path: str, legacy: bool = False):
              text = path.read_text(encoding='utf-8')
              if model_path in text:
                  return
              if not text.rstrip().endswith(')'):
                  raise RuntimeError(f'{path}: malformed footprint')
              pos_token = 'at' if legacy else 'offset'
              block = (
                  f'  (model "{model_path}"\n'
                  f'    ({pos_token} (xyz 0 0 0))\n'
                  f'    (scale (xyz 1 1 1))\n'
                  f'    (rotate (xyz 0 0 0))\n'
                  f'  )\n'
              )
              text = text.rstrip()[:-1].rstrip() + '\n' + block + ')\n'
              path.write_text(text, encoding='utf-8', newline='\n')

          lib = root / 'hardware' / 'footprints' / 'poa-sensor.pretty'
          append_model(
              lib / 'E73-2G4M08S1C.kicad_mod',
              '${KIPRJMOD}/3dmodels/E73-2G4M08S1C.step',
              legacy=True,
          )
          append_model(
              lib / 'KXOB25-14X1F.kicad_mod',
              '${KIPRJMOD}/3dmodels/KXOB25-14X1F.step',
              legacy=True,
          )
          append_model(
              lib / 'ADS1115IDGSR_VSSOP-10.kicad_mod',
              '${KICAD8_3DMODEL_DIR}/Package_SO.3dshapes/VSSOP-10_3x3mm_P0.5mm.step',
              legacy=False,
          )

          # Add the same models to footprints already embedded in the production
          # PCB. Updating a library file alone does not retroactively update an
          # existing board instance.
          board_path = root / 'hardware' / 'poa-sensor.kicad_pcb'
          board = board_path.read_text(encoding='utf-8')

          def balanced(text: str, start: int):
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(text)):
                  c = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          in_string = False
                      continue
                  if c == '"':
                      in_string = True
                  elif c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise RuntimeError('unterminated s-expression')

          def ref_of(block: str):
              m = re.search(r'\(property\s+"Reference"\s+"([^"]+)"', block)
              if m:
                  return m.group(1)
              m = re.search(r'\(fp_text\s+reference\s+"?([^"\s\)]+)', block)
              return m.group(1) if m else None

          board_models = {
              'U1': '${KIPRJMOD}/3dmodels/E73-2G4M08S1C.step',
              'CELL1': '${KIPRJMOD}/3dmodels/KXOB25-14X1F.step',
              'U2': '${KICAD8_3DMODEL_DIR}/Package_SO.3dshapes/VSSOP-10_3x3mm_P0.5mm.step',
          }

          edits = []
          for m in re.finditer(r'(?m)^\t\(footprint\s', board):
              start = m.start() + 1
              start, end = balanced(board, start)
              block = board[start:end]
              ref = ref_of(block)
              model_path = board_models.get(ref)
              if not model_path or model_path in block:
                  continue
              model = (
                  f'\n\t(model "{model_path}"\n'
                  f'\t\t(offset (xyz 0 0 0))\n'
                  f'\t\t(scale (xyz 1 1 1))\n'
                  f'\t\t(rotate (xyz 0 0 0))\n'
                  f'\t)'
              )
              replacement = block[:-1].rstrip() + model + '\n)'
              edits.append((start, end, replacement))

          for start, end, replacement in sorted(edits, reverse=True):
              board = board[:start] + replacement + board[end:]
          board_path.write_text(board, encoding='utf-8', newline='\n')

          readme = root / 'hardware' / 'footprints' / 'README.md'
          txt = readme.read_text(encoding='utf-8')
          marker = '## 3D model policy'
          if marker not in txt:
              txt = txt.rstrip() + '''\n\n## 3D model policy\n\nThe mechanically relevant fitted custom parts have 3D models:\n\n- `E73-2G4M08S1C`: project-local STEP clearance envelope, 18 x 13 x 0.8 mm\n- `KXOB25-14X1F`: project-local STEP clearance envelope, 23 x 8 x 1.8 mm\n- `ADS1115IDGSR_VSSOP-10`: uses the standard KiCad `Package_SO` VSSOP-10 STEP model\n\n`SWD_Pogo_1x05_P2.00mm` and `WirePads_1x02_P2.54mm` intentionally have **no separate 3D body**. They are exposed PCB copper / solder pads, not fitted components. KiCad already renders their pads as part of the PCB; adding a connector or pogo-pin body would misrepresent the assembled sensor.\n\nThe two project-local STEP files are generated by `tools/generate_3d_models.py`. They are mechanical envelopes for fit/clearance checking, not photorealistic models.\n'''
              readme.write_text(txt, encoding='utf-8', newline='\n')

          # Sanity checks.
          assert (root / 'hardware/3dmodels/E73-2G4M08S1C.step').exists()
          assert (root / 'hardware/3dmodels/KXOB25-14X1F.step').exists()
          assert '${KIPRJMOD}/3dmodels/E73-2G4M08S1C.step' in (lib / 'E73-2G4M08S1C.kicad_mod').read_text()
          assert '${KIPRJMOD}/3dmodels/KXOB25-14X1F.step' in (lib / 'KXOB25-14X1F.kicad_mod').read_text()
          assert '${KICAD8_3DMODEL_DIR}/Package_SO.3dshapes/VSSOP-10_3x3mm_P0.5mm.step' in (lib / 'ADS1115IDGSR_VSSOP-10.kicad_mod').read_text()
          assert '${KIPRJMOD}/3dmodels/E73-2G4M08S1C.step' in board
          assert '${KIPRJMOD}/3dmodels/KXOB25-14X1F.step' in board
          print(f'updated {len(edits)} embedded PCB footprint model bindings')
          PY

          rm .github/workflows/add-custom-3d-models.yml

      - name: Commit generated models and bindings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardware: add custom component 3D models'
          git push origin HEAD:main
