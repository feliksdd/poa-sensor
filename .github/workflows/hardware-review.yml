name: Reviewed KiCad 10 hardware
on:
  push:
    paths: ['hardware/**', 'tools/review_hardware.sh', '.github/workflows/hardware-review.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Configure standard libraries
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Native ERC and DRC
        run: bash tools/review_hardware.sh
      - name: Preserve native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-10-review
          path: hardware/review_2026-11-09/
